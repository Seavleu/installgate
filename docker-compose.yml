services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - cache:/app/.cache
    environment:
      CACHE_PATH: /app/.cache/installgate.sqlite
      RATE_LIMIT_TRUST_PROXY: "true"

  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    ports:
      - "3000:3000"
    environment:
      API_URL: http://api:8000
    depends_on:
      - api

volumes:
  cache:
