name: Task
description: A unit of work from the delivery plan (T01..T20) or a new task
title: "Txx <short title>"
labels: []
body:
  - type: input
    id: task_id
    attributes:
      label: Task id
      description: From docs/prd-ssd.md section 13, or the next free number
      placeholder: T21
    validations:
      required: true
  - type: dropdown
    id: owner
    attributes:
      label: Owner
      options:
        - "Engineer A: core logic"
        - "Engineer B: model and product"
        - "Both"
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: What and why
      placeholder: Parse Dockerfile FROM lines so the runtime floor check can run.
    validations:
      required: true
  - type: input
    id: depends
    attributes:
      label: Depends on
      placeholder: "T04, T05"
  - type: textarea
    id: done_when
    attributes:
      label: Done when
      description: A check someone else can run
      placeholder: "`pytest engine/tests/test_parsers.py` passes; no network call on invalid input"
    validations:
      required: true
