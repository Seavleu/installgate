[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "installgate"
version = "0.1.3"
description = "Pre-install trust gate for coding agents. Check pip/npm before install; never runs the package."
readme = "docs/pypi.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "InstallGate contributors" }]
keywords = [
  "security",
  "supply-chain",
  "mcp",
  "pip",
  "npm",
  "agents",
  "typosquat",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2",
  "httpx>=0.27",
  "pyyaml>=6",
  "rapidfuzz>=3",
  "packaging>=24",
  "openai>=1.40",
  "mcp>=1.2",
]

[project.optional-dependencies]
server = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]
tavily = ["tavily-python>=0.5"]
dev = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=3.8",
  "types-PyYAML>=6",
]

[project.urls]
Homepage = "https://github.com/Seavleu/installgate"
Documentation = "https://github.com/Seavleu/installgate#readme"
Changelog = "https://github.com/Seavleu/installgate/blob/main/CHANGELOG.md"
Source = "https://github.com/Seavleu/installgate"
Issues = "https://github.com/Seavleu/installgate/issues"

[project.scripts]
ig = "mcp_server.cli:main"
installgate = "mcp_server.cli:main"
installgate-mcp = "mcp_server.server:main"

[tool.hatch.build.targets.sdist]
exclude = [
  "/eval",
  "/ui",
  "/.github",
  "/.cursor",
]

[tool.hatch.build.targets.wheel]
packages = [
  "contracts",
  "engine",
  "validator",
  "router",
  "remediate",
  "mcp_server",
]

[tool.hatch.build.targets.wheel.force-include]
"engine/policy.yaml" = "engine/policy.yaml"
"engine/runtime_floors.yaml" = "engine/runtime_floors.yaml"
"engine/data/pypi-top5000-2026-10-27.txt" = "engine/data/pypi-top5000-2026-10-27.txt"
"router/prompts/extract.txt" = "router/prompts/extract.txt"
"router/prompts/explain.txt" = "router/prompts/explain.txt"
"router/prompts/rank_substitute.txt" = "router/prompts/rank_substitute.txt"

[tool.hatch.build.targets.wheel.shared-data]
"man/ig.1" = "share/man/man1/ig.1"

[tool.ruff]
line-length = 100
target-version = "py311"
src = [
  "contracts",
  "engine",
  "validator",
  "router",
  "remediate",
  "mcp_server",
  "eval",
  "tests",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["UP042"]

[tool.ruff.lint.per-file-ignores]
"contracts/contracts.py" = ["E501", "UP037", "UP045"]
"tests/test_policy.py" = ["E402"]

[tool.ruff.format]
exclude = ["contracts/contracts.py"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = [
  "contracts",
  "engine",
  "validator",
  "router",
  "remediate",
  "mcp_server",
]

[[tool.mypy.overrides]]
module = ["mcp.*", "tavily", "yaml"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error"]
addopts = "--cov=contracts --cov=engine --cov=validator --cov=router --cov=remediate --cov=mcp_server --cov-report=term-missing"
