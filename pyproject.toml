[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "installgate"
version = "0.1.2"
description = "Pre-install trust gate for coding agents. Check pip/npm before install; never runs the package."
readme = "docs/pypi.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "InstallGate contributors" }]
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic>=2",
  "httpx",
  "pyyaml",
  "rapidfuzz",
  # PEP 440 comparison, so an OSV record scoped to 1.82.7 does not match
  # 1.82.70. Already present transitively; declared now that we rely on it.
  "packaging",
  "openai",
  "mcp",
  "typer",
]

[project.urls]
Homepage = "https://github.com/Seavleu/installgate"
Documentation = "https://github.com/Seavleu/installgate#readme"
Source = "https://github.com/Seavleu/installgate"
Issues = "https://github.com/Seavleu/installgate/issues"

[project.scripts]
ig = "mcp_server.cli:main"
installgate = "mcp_server.cli:main"

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-asyncio",
  "respx",
  "ruff",
  "mypy",
  "pre-commit",
  "types-PyYAML",
]
tavily = ["tavily-python"]  # T08. Skip on Windows ARM (tiktoken needs Rust).

[tool.hatch.build.targets.wheel]
packages = [
  "contracts",
  "engine",
  "validator",
  "router",
  "remediate",
  "mcp_server",
]
# Hatchling ships .py only. Policy, floors, typosquat list, and prompts are data.
[tool.hatch.build.targets.wheel.force-include]
"engine/policy.yaml" = "engine/policy.yaml"
"engine/runtime_floors.yaml" = "engine/runtime_floors.yaml"
"engine/data/pypi-top5000-2026-10-27.txt" = "engine/data/pypi-top5000-2026-10-27.txt"
"router/prompts/extract.txt" = "router/prompts/extract.txt"
"router/prompts/explain.txt" = "router/prompts/explain.txt"
"router/prompts/rank_substitute.txt" = "router/prompts/rank_substitute.txt"

[tool.ruff]
line-length = 100
target-version = "py311"
src = [
  "contracts",
  "engine",
  "validator",
  "router",
  "remediate",
  "mcp_server",
  "eval",
  "tests",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["UP042"]

[tool.ruff.lint.per-file-ignores]
"contracts/contracts.py" = ["E501", "UP037", "UP045"]
"tests/test_policy.py" = ["E402"]

[tool.ruff.format]
exclude = ["contracts/contracts.py"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = [
  "contracts",
  "engine",
  "validator",
  "router",
  "remediate",
  "mcp_server",
]

[[tool.mypy.overrides]]
module = ["mcp.*", "tavily", "yaml"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error"]
